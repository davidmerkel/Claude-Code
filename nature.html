<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    .slideshow {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slide.active { opacity: 1; }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .caption {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: Georgia, serif;
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }

    .dots {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: background 0.3s;
    }

    .dot.active { background: white; }
  </style>
</head>
<body>
  <div class="slideshow" id="slideshow"></div>

  <script>
    const images = [
      { url: "https://picsum.photos/seed/forest1/1920/1080", caption: "Ancient Forest" },
      { url: "https://picsum.photos/seed/mountain2/1920/1080", caption: "Mountain Peak" },
      { url: "https://picsum.photos/seed/ocean3/1920/1080", caption: "Open Ocean" },
      { url: "https://picsum.photos/seed/meadow4/1920/1080", caption: "Wildflower Meadow" },
      { url: "https://picsum.photos/seed/waterfall5/1920/1080", caption: "Hidden Waterfall" },
      { url: "https://picsum.photos/seed/desert6/1920/1080", caption: "Desert Dunes" },
    ];

    const slideshow = document.getElementById("slideshow");
    let current = 0;

    // Build slides
    images.forEach((img, i) => {
      const slide = document.createElement("div");
      slide.className = "slide" + (i === 0 ? " active" : "");
      slide.innerHTML = `<img src="${img.url}" alt="${img.caption}">`;
      slideshow.appendChild(slide);
    });

    // Dots
    const dotsEl = document.createElement("div");
    dotsEl.className = "dots";
    images.forEach((_, i) => {
      const dot = document.createElement("div");
      dot.className = "dot" + (i === 0 ? " active" : "");
      dot.onclick = () => goTo(i);
      dotsEl.appendChild(dot);
    });
    slideshow.appendChild(dotsEl);

    // Caption
    const caption = document.createElement("div");
    caption.className = "caption";
    caption.textContent = images[0].caption;
    slideshow.appendChild(caption);

    function goTo(n) {
      document.querySelectorAll(".slide")[current].classList.remove("active");
      document.querySelectorAll(".dot")[current].classList.remove("active");
      current = n;
      document.querySelectorAll(".slide")[current].classList.add("active");
      document.querySelectorAll(".dot")[current].classList.add("active");
      caption.textContent = images[current].caption;
    }

    setInterval(() => goTo((current + 1) % images.length), 4000);
  </script>
</body>
</html>
